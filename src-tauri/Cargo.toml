[package]
name = "chatwow"
version = "0.3.0"
description = "A sleek multi-channel Twitch chat client"
authors = ["chetwow"]
edition = "2021"

[lib]
name = "chatwow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# gzip/brotli are for `linkinfo`: a page whose metadata sits behind half a
# megabyte of inline script (YouTube does) costs a fifth of that compressed.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
anyhow = "1"
rand = "0.8"
parking_lot = "0.12"

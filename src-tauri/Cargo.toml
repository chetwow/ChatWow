[package]
name = "chatwow"
version = "0.7.0"
description = "A sleek multi-channel Twitch chat client"
authors = ["chetwow"]
edition = "2021"

[lib]
name = "chatwow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Diagnostics. `log` is the facade the plugin installs a logger behind, so
# everything here says `log::warn!` and the plugin decides where it lands.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# gzip/brotli are for `linkinfo`: a page whose metadata sits behind half a
# megabyte of inline script (YouTube does) costs a fifth of that compressed.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
anyhow = "1"
base64 = "0.22"
tempfile = "3"
rand = "0.8"
parking_lot = "0.12"

# In-app updates. Desktop-only: the plugin has no mobile implementation, and
# this is the target filter the Tauri docs prescribe. Everything it needs to
# verify a download -- the public key -- is compiled in from tauri.conf.json.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4.1"

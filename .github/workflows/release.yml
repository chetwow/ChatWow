# Builds the installers on real machines of each kind and attaches them to a
# draft GitHub release.
#
# Windows is why this exists: Tauri treats cross-compiling the NSIS installer
# from macOS as a last resort it doesn't test, and a Windows runner sidesteps
# the question.
#
# This is also what makes the app able to update itself. Each job signs its
# installers with the minisign key in TAURI_SIGNING_PRIVATE_KEY and merges its
# platform into a `latest.json` on the release; `plugins.updater` in
# tauri.conf.json points every installed copy at that file. Publishing the
# draft is therefore the act of shipping the update -- a draft's assets 404 for
# everyone without push access, `releases/latest` included.
#
# Prefer running it from the Actions tab after pushing the version commit to
# main. GitHub scopes caches by ref, so workflow_dispatch runs can reuse the
# npm and Rust caches written by earlier releases. tauri-action creates the
# version tag along with the draft release.
#
#   gh workflow run release.yml --ref main
#
# Pushing a pre-created v* tag remains a fallback. Either way the release lands
# as a draft, named from the version in tauri.conf.json -- nothing is published
# until you say so.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # The explicit audit below is authoritative. Avoid making every clean
      # install call the advisory endpoint too, and favor setup-node's cache.
      - run: npm ci --no-audit --prefer-offline --no-fund
      - name: Audit npm dependencies
        shell: bash
        run: |
          # npm's advisory endpoint occasionally returns a transient 5xx. Retry
          # those service failures, but fail immediately on a real audit report.
          for attempt in 1 2 3; do
            if output="$(npm audit --fetch-timeout=60000 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
              printf '%s\n' "$output"
            fi

            if ! printf '%s\n' "$output" | grep -Eqi \
              'audit endpoint returned an error|429 Too Many Requests|50[234] (Bad Gateway|Service Unavailable|Gateway Timeout)|ECONNRESET|EAI_AGAIN|ETIMEDOUT|ENETUNREACH|ENOTFOUND'; then
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit "$status"
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file src-tauri/Cargo.lock

      - name: Check release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi

  build:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One platform at a time, deliberately. tauri-action builds `latest.json`
      # by downloading the copy already on the release, merging this platform
      # in, and re-uploading it. Two jobs finishing together lose one
      # platform's entry -- silently, and only that platform then never sees
      # another update. Four sequential builds a few times a year is the
      # cheaper side of that trade.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # Direct-download macOS apps need both a Developer ID signature and an
      # Apple notarization ticket. Keep both private keys ephemeral: the
      # certificate is imported into an isolated keychain and the notary key
      # exists only under RUNNER_TEMP for the life of this job.
      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_BASE64 \
            KEYCHAIN_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed, notarized macOS releases."
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/chatwow-developer-id.p12"
          keychain_path="$RUNNER_TEMP/chatwow-signing.keychain-db"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -F'"' '/Developer ID Application:/ { print $2; exit }'
          )"
          if [ -z "$signing_identity" ]; then
            echo "::error::The imported certificate has no usable Developer ID Application identity."
            exit 1
          fi

          if ! xcrun notarytool history \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" >/dev/null
          then
            echo "::error::Apple rejected the notarization API credentials."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      # Tauri's Linux build needs the webview and its packaging tools; the
      # other two runners ship theirs.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # One macOS runner builds both architectures, an entry at a time.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci --no-audit --prefer-offline --no-fund

      # A release built without a real key is one nothing can ever update to,
      # and the damage is only visible months later when the next version goes
      # unnoticed. Both halves are checked: the public key is committed, the
      # private one has to arrive as a secret.
      - name: Check the updater is signable
        shell: bash
        run: |
          if grep -q 'REPLACE_ME' src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey is still the placeholder. Run 'npm run tauri signer generate' and commit the public key."
            exit 1
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Without it the bundles get no signature and no latest.json is uploaded."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri signs with the Developer ID identity imported above, submits
          # the app to Apple's notary service, and staples the returned ticket.
          # These arrive empty on non-macOS matrix entries and are ignored.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          # Optional: only a fork building against its own Twitch app needs
          # this. Unset, it arrives empty and build.rs falls back to the
          # committed Client ID, which is the one this app ships with.
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          # Not optional, unlike the one above. This isn't Apple's or
          # Microsoft's code signing -- it's the key an installed copy checks a
          # download against before it replaces itself. Unset, the bundles get
          # no `.sig`, tauri-action skips `latest.json` without failing, and
          # the release ships that nothing can update to.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ChatWow v__VERSION__
          releaseBody: |
            Download the installer for your platform below.

            - **Windows** — `-setup.exe`
            - **macOS** — `aarch64.dmg` for Apple Silicon, `x64.dmg` for Intel
            - **Linux** — `.AppImage`, `.deb` or `.rpm`

            ChatWow updates itself from here — Settings → General → Updates.
            You only need to come back to this page once: install this version by
            hand, and it will offer you the next one on its own.

            macOS builds are signed with Developer ID and notarized by Apple.
            Windows is not code-signed yet, so SmartScreen may ask for confirmation
            on first launch.
          releaseDraft: true
          # A tag with a hyphen in it is a semver prerelease -- v0.6.0-rc.1 and
          # friends. That has to reach GitHub as an actual prerelease, because
          # `releases/latest` skips those and `releases/latest/download/latest.json`
          # is what every installed copy reads: publishing an rc as an ordinary
          # release would hand it to everyone. Rehearsing an update against one
          # is the whole reason CHATWOW_UPDATE_ENDPOINT exists.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Verify Apple signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(
            find src-tauri/target \
              -path '*/release/bundle/macos/*.app' \
              -prune -print -quit
          )"
          if [ -z "$app_path" ]; then
            echo "::error::Couldn't find the bundled macOS app."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/chatwow-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/chatwow-developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8"
